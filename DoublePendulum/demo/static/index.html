<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Double pendulum</title>
  <style>
    body { font-family: sans-serif; margin: 1.5rem; }
    label, button, select, input { margin-right: 0.5rem; }
    #view { display: block; margin-top: 1rem; background: #eee; }
    #status { margin-top: 0.5rem; }
  </style>
</head>
<body>
  <label>Model <select id="model"></select></label>
  <button id="start" type="button">Start</button>
  <label>Kick scale <input id="scale" type="range" min="0.01" max="0.25" step="0.01" value="0.1"></label>
  <span id="scale-value">0.1</span>
  <button id="kick" type="button" disabled>Kick</button>
  <img id="view" width="512" height="512" alt="pendulum">
  <div id="status"></div>
  <script>
    const model = document.getElementById("model");
    const start = document.getElementById("start");
    const kick = document.getElementById("kick");
    const scale = document.getElementById("scale");
    const scaleValue = document.getElementById("scale-value");
    const view = document.getElementById("view");
    const statusEl = document.getElementById("status");
    const done = new Set(["balanced", "off_track", "timeout"]);
    let frameUrl = null;
    let looping = false;

    function show(blob, status) {
      if (frameUrl) URL.revokeObjectURL(frameUrl);
      frameUrl = URL.createObjectURL(blob);
      view.src = frameUrl;
      statusEl.textContent = status || "";
    }

    async function postFrame(url) {
      const resp = await fetch(url, { method: "POST", credentials: "same-origin" });
      if (!resp.ok) throw new Error(await resp.text());
      show(await resp.blob(), resp.headers.get("x-status"));
      return resp.headers.get("x-status");
    }

    async function loop() {
      if (looping) return;
      looping = true;
      try {
        let status = "working";
        while (!done.has(status)) {
          status = await postFrame("/pendulum/step");
        }
      } finally {
        looping = false;
      }
    }

    scale.addEventListener("input", () => { scaleValue.textContent = scale.value; });

    fetch("/pendulum/models").then(r => r.json()).then(models => {
      for (const [id, label] of Object.entries(models)) {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = label;
        model.appendChild(opt);
      }
    });

    start.addEventListener("click", async () => {
      const resp = await fetch("/pendulum/session", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: model.value }),
      });
      if (!resp.ok) { statusEl.textContent = await resp.text(); return; }
      show(await resp.blob(), resp.headers.get("x-status"));
      kick.disabled = false;
    });

    kick.addEventListener("click", async () => {
      await postFrame("/pendulum/kick?scale=" + encodeURIComponent(scale.value));
      loop();
    });
  </script>
</body>
</html>
