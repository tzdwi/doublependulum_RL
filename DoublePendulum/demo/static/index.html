<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kick the double pendulum</title>
  <style>
    body { font-family: sans-serif; margin: 1rem; max-width: 640px; }
    label, button, select, input { margin-right: 0.5rem; }
    .row { margin: 0.5rem 0; }
    #view { display: block; width: 100%; height: auto; border: 1px solid #ccc; }
    #force { position: relative; height: 10px; background: #eee; margin-top: 0.25rem; }
    #force-bar { position: absolute; top: 0; height: 100%; background: #c00; }
    #force::after { content: ""; position: absolute; left: 50%; top: 0; height: 100%; border-left: 1px solid #000; }
    #settled { color: #070; font-weight: bold; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/ort.wasm.min.js"></script>
</head>
<body>
  <div class="row">
    <label>Model <select id="model"></select></label>
    <button id="start" type="button">Start</button>
  </div>
  <div class="row">
    <label>Kick (N) <input id="size" type="range" min="0" max="25" step="0.5" value="10"></label>
    <span id="size-value">10</span>
    <label>Duration (s) <input id="duration" type="range" min="1" max="10" step="1" value="1"></label>
    <span id="duration-value">0.05</span>
  </div>
  <div class="row">
    <button id="left" type="button" disabled>&larr; Kick left</button>
    <button id="right" type="button" disabled>Kick right &rarr;</button>
  </div>
  <canvas id="view" width="720" height="720"></canvas>
  <div class="row">Model force <div id="force"><div id="force-bar"></div></div></div>
  <div class="row">
    Time <span id="time">0.0</span> s &middot; Kicks <span id="kicks">0</span>
    &middot; Largest kick <span id="biggest">0.0</span> N
    <span id="settled" hidden>&middot; Settled (still for 5 s)</span>
  </div>
  <div class="row" id="status">Pick a model and press Start.</div>
  <script type="module" src="game.js"></script>
</body>
</html>
